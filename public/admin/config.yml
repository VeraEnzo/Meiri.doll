# Configuración del panel de administración (Sveltia CMS).
# Formato compatible con Decap CMS: si algún día se cambia de CMS,
# este archivo se reutiliza tal cual.

backend:
  name: github
  repo: VeraEnzo/Meiri.doll
  branch: main
  # Proxy de autenticación (Cloudflare Workers). Habilita el login con cuenta
  # de GitHub, sin token personal. GitHub todavía no permite completar el
  # flujo OAuth desde el navegador, por eso hace falta esta pieza.
  # Ver "Configurar el login con cuenta de GitHub" en el README.
  base_url: https://sveltia-cms-auth.enzovera646.workers.dev

# El nombre del archivo de cada producto define la URL de su página, así que
# tiene que ser seguro para una URL. Sin esto, un producto llamado "Camisón
# Dulce" generaría camisón-dulce.yml y la dirección quedaría con el acento
# escapado (/productos/camis%C3%B3n-dulce).
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

# Las fotos van a src/assets/ (no a public/) para que Astro las optimice en el
# build. Al estar fuera de public/ no tienen URL propia, así que se referencian
# por su ruta en el repo y el sitio las resuelve con import.meta.glob.
# Por eso media_folder y public_folder son iguales acá.
media_folder: /src/assets/productos
public_folder: /src/assets/productos

media_libraries:
  default:
    config:
      # Normaliza los nombres al subir: "Captura de pantalla 2026.png"
      # queda como "captura-de-pantalla-2026.png". Evita espacios,
      # mayúsculas y acentos en las URLs.
      slugify_filename: true
      # Tope de 8 MB por archivo, como red de contención ante subidas
      # accidentales. Una foto de celular ronda los 2-4 MB.
      max_file_size: 8388608

collections:
  - name: productos
    label: Productos
    label_singular: Producto
    folder: /src/content/productos
    extension: yml
    format: yaml
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{name}}'
    sortable_fields: [order, name]
    fields:
      # Mientras el sitio está en beta los productos salen publicados aunque
      # estén incompletos. Cuando empiece a tener visitas reales, cambiar el
      # default a true para que los nuevos arranquen ocultos.
      - name: draft
        label: Borrador
        widget: boolean
        default: false
        hint: 'Tildado = no se muestra en el sitio. Sirve para ir armando un producto sin publicarlo.'

      - name: name
        label: Nombre
        widget: string

      - name: description
        label: Descripción corta
        widget: text
        required: false
        hint: 'La que se ve en la card del catálogo. Los saltos de línea se respetan.'

      - name: images
        label: Fotos
        widget: list
        required: false
        hint: 'La primera foto es la que se ve al cargar. Se pueden arrastrar para reordenar. Hace falta al menos una para publicar.'
        field:
          name: image
          label: Foto
          widget: image

      - name: tags
        label: Etiquetas
        widget: list
        required: false
        hint: 'Opcional. Ej: hecho con frisa, manga globo.'

      - name: price
        label: Precio
        widget: string
        required: false
        hint: 'Opcional, se muestra tal cual se escribe. Ej: $50.000'

      # --- Solo se ven en la página del producto ---
      # Todo opcional: la página muestra solo los campos cargados. Un producto
      # sin estos datos se ve igual que antes, sin huecos.
      - name: galeria
        label: Fotos adicionales
        widget: list
        required: false
        hint: 'Se suman a la galería de la página del producto, después de las Fotos. No aparecen en el catálogo. Ideales para detalle de tela, probador o contexto.'
        field:
          name: image
          label: Foto
          widget: image

      - name: detalle
        label: Descripción larga
        widget: text
        required: false
        hint: 'Solo se ve en la página del producto. Si se deja vacía, se usa la descripción corta.'

      - name: material
        label: Material
        widget: string
        required: false
        hint: 'Ej: 96% Nylon, 4% Elastano'

      - name: colores
        label: Colores disponibles
        widget: list
        required: false
        hint: 'Uno por ítem. Ej: Vanilla Lace, Parfait Pink.'

      - name: talles
        label: Talles
        widget: list
        required: false
        hint: 'Uno por ítem. Ej: Único, S, M, L.'

      - name: medidas
        label: Medidas
        widget: text
        required: false
        hint: 'Opcional. Ej: Largo 45 cm · Busto 80-95 cm. Los saltos de línea se respetan.'

      - name: cuidados
        label: Cuidados
        widget: text
        required: false
        hint: 'Opcional. Ej: Lavar a mano con agua fría. No usar secadora.'

      - name: order
        label: Orden
        widget: number
        value_type: int
        default: 0
        hint: 'Menor número = aparece antes en el catálogo.'
