# Configuración del panel de administración (Sveltia CMS).
# Formato compatible con Decap CMS: si algún día se cambia de CMS,
# este archivo se reutiliza tal cual.

backend:
  name: github
  repo: VeraEnzo/Meiri.doll
  branch: main
  # Fase 3 — acceso para Candela sin token personal.
  # Descomentar apuntando al Worker de Cloudflare:
  # base_url: https://TU-WORKER.workers.dev

# Las fotos van a src/assets/ (no a public/) para que Astro las optimice en el
# build. Al estar fuera de public/ no tienen URL propia, así que se referencian
# por su ruta en el repo y el sitio las resuelve con import.meta.glob.
# Por eso media_folder y public_folder son iguales acá.
media_folder: /src/assets/productos
public_folder: /src/assets/productos

media_libraries:
  default:
    config:
      # Normaliza los nombres al subir: "Captura de pantalla 2026.png"
      # queda como "captura-de-pantalla-2026.png". Evita espacios,
      # mayúsculas y acentos en las URLs.
      slugify_filename: true
      # Tope de 8 MB por archivo, como red de contención ante subidas
      # accidentales. Una foto de celular ronda los 2-4 MB.
      max_file_size: 8388608

collections:
  - name: productos
    label: Productos
    label_singular: Producto
    folder: /src/content/productos
    extension: yml
    format: yaml
    create: true
    delete: true
    slug: '{{slug}}'
    summary: '{{name}}'
    sortable_fields: [order, name]
    fields:
      - name: name
        label: Nombre
        widget: string

      - name: description
        label: Descripción
        widget: text
        hint: 'Los saltos de línea se respetan tal cual en la card.'

      - name: images
        label: Fotos
        widget: list
        min: 1
        hint: 'La primera foto es la que se ve al cargar. Se pueden arrastrar para reordenar.'
        field:
          name: image
          label: Foto
          widget: image

      - name: tags
        label: Etiquetas
        widget: list
        required: false
        hint: 'Opcional. Ej: hecho con frisa, manga globo.'

      - name: price
        label: Precio
        widget: string
        required: false
        hint: 'Opcional, se muestra tal cual se escribe. Ej: $50.000'

      - name: order
        label: Orden
        widget: number
        value_type: int
        default: 0
        hint: 'Menor número = aparece antes en el catálogo.'
